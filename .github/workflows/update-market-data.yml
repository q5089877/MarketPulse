name: Update MarketPulse data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install share card renderer
        run: python -m pip install pillow
      - name: Fetch public market data
        run: python scripts/update_data.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json data/masters_analysis.json og-card.svg og-card.png
          git diff --cached --quiet || git commit -m "Update market data"
          git push
